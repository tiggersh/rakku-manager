<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f13" />
  <title>관리자 계정 관리 - SH 라꾸 매니저</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="app-shell">
    <div class="page" id="page-content">
      <p class="text-secondary">불러오는 중...</p>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/auth.js';
    import { supabase } from '/js/supabaseClient.js';
    import { renderAdminNav, renderHeader, showToast } from '/js/ui.js';

    const page = document.getElementById('page-content');
    let myId = null;

    async function init() {
      const profile = await requireAuth('admin');
      if (!profile) return;
      myId = profile.id;
      await render();
    }

    async function render() {
      const { data: admins, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('role', 'admin')
        .order('created_at', { ascending: false });

      if (error) {
        page.innerHTML = `<p class="error-text">불러오기 실패: ${error.message}</p>`;
        return;
      }

      page.innerHTML = `
        <a href="/admin/sellers.html" class="text-secondary" style="font-size: 13px;">← 판매자 관리</a>
        ${renderHeader('관리자 계정 관리', `총 ${admins.length}명 · 모두 동등한 권한`)}

        <div class="card" style="margin-bottom: 16px;">
          <h3 style="font-size: 15px; margin-bottom: 14px;">새 관리자 등록</h3>
          <form id="admin-form">
            <div class="field">
              <label>이메일 (로그인 아이디)</label>
              <input type="email" id="f-email" required placeholder="admin@example.com" />
            </div>
            <div class="field">
              <label>초기 비밀번호</label>
              <input type="text" id="f-password" required placeholder="6자 이상, 나중에 본인이 변경 가능" />
            </div>
            <div class="field">
              <label>이름</label>
              <input type="text" id="f-name" required placeholder="예: 대장" />
            </div>
            <p class="error-text" id="form-error"></p>
            <button type="submit" class="btn btn-primary" id="submit-btn">등록</button>
          </form>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          ${admins.map(a => `
            <div class="card">
              <div class="flex-between">
                <div>
                  <div style="font-weight: 600; font-size: 14px;">${a.name} ${a.id === myId ? '<span class="text-secondary" style="font-weight:400; font-size:12px;">(나)</span>' : ''}</div>
                </div>
                <span class="badge ${a.status === 'active' ? 'badge-success' : 'badge-danger'}">${a.status === 'active' ? '활성' : '비활성'}</span>
              </div>
              ${a.id !== myId ? `
              <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button class="btn btn-ghost btn-toggle" data-id="${a.id}" data-status="${a.status}" style="font-size: 13px; padding: 8px; flex: 1;">
                  ${a.status === 'active' ? '비활성화' : '활성화'}
                </button>
                <button class="btn btn-ghost btn-delete" data-id="${a.id}" data-name="${a.name}" style="font-size: 13px; padding: 8px; flex: 1; color: var(--danger);">삭제</button>
              </div>
              ` : `<p class="text-secondary" style="font-size: 12px; margin-top: 8px;">본인 계정은 여기서 삭제/비활성화할 수 없습니다.</p>`}
            </div>
          `).join('')}
        </div>
      `;

      let nav = document.querySelector('.bottom-nav');
      if (nav) nav.remove();
      document.querySelector('.app-shell').insertAdjacentHTML('beforeend', renderAdminNav('sellers'));

      document.getElementById('admin-form').addEventListener('submit', onSubmit);
      document.querySelectorAll('.btn-toggle').forEach(btn => {
        btn.addEventListener('click', async () => {
          const isActive = btn.dataset.status === 'active';
          const { error } = await supabase
            .from('profiles')
            .update({ status: isActive ? 'inactive' : 'active' })
            .eq('id', btn.dataset.id);
          if (error) { showToast('변경 실패: ' + error.message, 'danger'); return; }
          showToast('변경되었습니다', 'success');
          render();
        });
      });
      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => onDelete(btn.dataset.id, btn.dataset.name));
      });
    }

    async function onSubmit(e) {
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      const btn = document.getElementById('submit-btn');
      errEl.textContent = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      const { data, error } = await supabase.functions.invoke('manage-users', {
        body: {
          action: 'create',
          email: document.getElementById('f-email').value.trim(),
          password: document.getElementById('f-password').value,
          name: document.getElementById('f-name').value.trim(),
          role: 'admin',
        },
      });

      if (error || data?.error) {
        errEl.textContent = '등록 실패: ' + (data?.error || error.message);
        btn.disabled = false;
        btn.textContent = '등록';
        return;
      }

      showToast('관리자가 등록되었습니다', 'success');
      render();
    }

    async function onDelete(id, name) {
      if (!confirm(`${name} 관리자 계정을 완전히 삭제하시겠습니까?\n\n주의: 이 관리자가 처리한 재고이동/정산/분배 이력이 있으면 삭제가 거부됩니다. 그런 경우 "비활성화"를 사용해주세요.`)) return;

      const { data, error } = await supabase.functions.invoke('manage-users', {
        body: { action: 'delete', userId: id },
      });

      const errMsg = data?.error || error?.message || '';
      if (errMsg) {
        if (errMsg.includes('foreign key') || errMsg.includes('violates')) {
          showToast('이력이 있어 삭제할 수 없습니다. 비활성화를 이용해주세요.', 'danger');
        } else {
          showToast('삭제 실패: ' + errMsg, 'danger');
        }
        return;
      }

      showToast('삭제되었습니다', 'success');
      render();
    }

    init();
  </script>
</body>
</html>
