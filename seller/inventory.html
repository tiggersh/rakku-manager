<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f13" />
  <title>내 재고 - SH 라꾸 매니저</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="app-shell">
    <div class="page" id="page-content">
      <p class="text-secondary">불러오는 중...</p>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/auth.js';
    import { supabase } from '/js/supabaseClient.js';
    import { renderSellerNav, renderHeader } from '/js/ui.js';

    const page = document.getElementById('page-content');

    async function init() {
      const profile = await requireAuth('seller');
      if (!profile) return;

      const { data: inventory, error } = await supabase
        .from('seller_inventory')
        .select('*, products(name, code)')
        .eq('seller_id', profile.id)
        .gt('quantity', 0)
        .order('quantity', { ascending: false });

      if (error) {
        page.innerHTML = `<p class="error-text">불러오기 실패: ${error.message}</p>`;
        return;
      }

      const total = inventory.reduce((sum, i) => sum + i.quantity, 0);

      page.innerHTML = `
        ${renderHeader('내 재고', `총 ${total}개 보유중`)}
        <div style="display: flex; flex-direction: column; gap: 10px;">
          ${inventory.length ? inventory.map(i => `
            <div class="card">
              <div class="flex-between">
                <div>
                  <div style="font-weight: 600; font-size: 14px;">${i.products?.name || '-'}</div>
                  <div class="text-secondary text-mono" style="font-size: 12px; margin-top: 2px;">${i.products?.code || ''}</div>
                </div>
                <div class="text-mono" style="font-size: 20px; font-weight: 700;">${i.quantity}개</div>
              </div>
            </div>
          `).join('') : '<p class="text-secondary" style="text-align:center; padding: 24px 0;">보유중인 재고가 없습니다.</p>'}
        </div>
        <a href="/seller/register-sale.html" class="btn btn-primary" style="margin-top: 20px; display: block; text-align: center;">판매 등록하기</a>
      `;

      document.querySelector('.app-shell').insertAdjacentHTML('beforeend', renderSellerNav('inventory'));
    }

    init();
  </script>
</body>
</html>
