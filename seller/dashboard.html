<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f13" />
  <title>홈 - SH 라꾸 매니저</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="app-shell">
    <div class="page" id="page-content">
      <p class="text-secondary">불러오는 중...</p>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from '/js/auth.js';
    import { supabase } from '/js/supabaseClient.js';
    import { won, renderSellerNav } from '/js/ui.js';

    const page = document.getElementById('page-content');

    async function init() {
      const profile = await requireAuth('seller');
      if (!profile) return;

      const today = new Date().toISOString().slice(0, 10);
      const monthStart = today.slice(0, 8) + '01';

      const [invRes, monthSalesRes, unassignedRes, openSettlementsRes] = await Promise.all([
        supabase.from('seller_inventory').select('quantity').eq('seller_id', profile.id).gt('quantity', 0),
        supabase.from('sales').select('*').eq('seller_id', profile.id).eq('status', 'active').gte('sale_date', monthStart),
        supabase.from('sales').select('admin_settlement_amount').eq('seller_id', profile.id).eq('status', 'active').is('settlement_id', null),
        supabase.from('settlements').select('total_due, paid_amount').eq('seller_id', profile.id).in('status', ['pending', 'partial']),
      ]);

      const totalStock = (invRes.data || []).reduce((sum, r) => sum + r.quantity, 0);
      const monthSales = monthSalesRes.data || [];
      const monthAmount = monthSales.reduce((sum, s) => sum + Number(s.sale_amount), 0);
      const monthCommission = monthSales.reduce((sum, s) => sum + Number(s.total_commission), 0);
      const unassigned = (unassignedRes.data || []).reduce((sum, s) => sum + Number(s.admin_settlement_amount), 0);
      const openOwed = (openSettlementsRes.data || []).reduce((sum, r) => sum + (Number(r.total_due) - Number(r.paid_amount)), 0);
      const unsettled = unassigned + openOwed;

      page.innerHTML = `
        <div class="flex-between" style="margin-bottom: 20px;">
          <div>
            <h1 style="font-size: 22px;">안녕하세요, ${profile.name}님</h1>
            <p class="text-secondary" style="margin-top: 4px; font-size: 13px;">SH 라꾸 매니저</p>
          </div>
          <button id="logout-btn" class="btn btn-ghost" style="width: auto; padding: 8px 14px; font-size: 12px;">로그아웃</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
          <div class="card">
            <div class="text-secondary" style="font-size: 12px;">내 재고</div>
            <div style="font-size: 22px; font-weight: 700; margin-top: 4px;">${totalStock}개</div>
          </div>
          <div class="card">
            <div class="text-secondary" style="font-size: 12px;">이번달 판매건수</div>
            <div style="font-size: 22px; font-weight: 700; margin-top: 4px;">${monthSales.length}건</div>
          </div>
          <div class="card">
            <div class="text-secondary" style="font-size: 12px;">이번달 판매금액</div>
            <div class="text-mono" style="font-size: 17px; font-weight: 700; margin-top: 4px; color: var(--accent-text);">${won(monthAmount)}</div>
          </div>
          <div class="card">
            <div class="text-secondary" style="font-size: 12px;">이번달 내 수수료</div>
            <div class="text-mono" style="font-size: 17px; font-weight: 700; margin-top: 4px; color: var(--success);">${won(monthCommission)}</div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 16px; background: var(--accent-dim); border-color: var(--accent);">
          <div class="flex-between">
            <span style="font-size: 13px; color: var(--accent-text);">관리자에게 정산해야 할 금액</span>
            <span class="text-mono" style="font-size: 16px; font-weight: 700;">${won(unsettled)}</span>
          </div>
        </div>

        <a href="/seller/register-sale.html" class="btn btn-primary" style="display: block; text-align: center;">판매 등록하기</a>
      `;

      document.querySelector('.app-shell').insertAdjacentHTML('beforeend', renderSellerNav('dashboard'));
      document.getElementById('logout-btn').addEventListener('click', logout);
    }

    init();
  </script>
</body>
</html>
